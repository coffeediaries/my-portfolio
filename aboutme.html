<!DOCTYPE html>
<html>
<head>
    <title>Lia's briefcase</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        .basketville-text {
            font-family: 'Libre Baskerville', serif;
        }
        .inline-container {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 2vw;
        }
        .textpad {
            padding: clamp(8px, 1.5vw, 24px) clamp(12px, 2.5vw, 32px);
            box-sizing: border-box;
        }
        body {
            background-color: #112250;
            color: #f4f1ea;
            padding-left: 20px;
        }

        .card {
            --w: clamp(240px, 40vw, 420px);
            --ease: cubic-bezier(0.25, 1, 0.5, 1);   /* fixed */
            position: relative;
            width: var(--w);
            aspect-ratio: 3 / 2;
            margin: calc(var(--w) / 3) auto;
            transition: transform 0.6s var(--ease);
            will-change: transform;
        }
        .card:hover,
        .card:focus-within { transform: scale(1.15); }

        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: transform 0.7s var(--ease);
        }
        .slide1 { z-index: 1; }
        .slide1 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .slide2 {
            padding: 20px;
            background: #f4f1ea;
            color: #112250;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .slide2 h3 { margin: 0 0 10px; font-size: 24px; }
        .slide2 p  { margin: 0; }
        .slide2::after {
            content: "";
            position: absolute;
            bottom: 15px;
            left: 50%;
            width: 30px;
            height: 4px;
            transform: translateX(-50%);
            background: #2c73df;
        }   /* <-- this closing brace was missing */

        .card:hover .slide1,
        .card:focus-within .slide1 { transform: translateY(-50%); }
        .card:hover .slide2,
        .card:focus-within .slide2 { transform: translateY(50%); }

        @media (prefers-reduced-motion: reduce) {
            .card, .slide { transition: none; }
        }
    </style>
</head>
<body>
    <div class="inline-container textpad">
        <a href="index.html" class="basketville-text font-bold">Home</a>
        <a href="engineering.html" class="basketville-text font-bold">Engineering</a>
        <a href="media.html" class="basketville-text font-bold">Media</a>
        <a href="aboutme.html" class="basketville-text font-bold">About Me</a>
    </div>

    <h1 class="basketville-text text-8xl textpad" style="line-height: 1.6;">About Me</h1>

    <div class="card" tabindex="0">
        <div class="slide slide1">
            <img src="card.png" alt="my namecard">
        </div>
        <div class="slide slide2">
            <div>   <!-- wrapper so h3 and p stack vertically -->
                <h3 class="basketville-text">Behind of card</h3>
                <p class="basketville-text">Or additional notes</p>
            </div> 
        </div>
    </div>
</body>
</html>
