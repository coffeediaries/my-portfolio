<!DOCTYPE html>
<html>
	<head>
		<title>Lia's briefcase</title>
		<script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
        <style>
            .basketville-text {
                font-family: 'Libre Baskerville', serif;
            }
            .inline-container {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                flex-wrap: wrap;
                gap: 2vw;
            }
            .textpad {
                padding: clamp(8px, 1.5vw, 24px) clamp(12px, 2.5vw, 32px);
                box-sizing: border-box;
            }
            body {
                background-color: #112250;
                color: #f4f1ea;
            }
        </style>
	</head>
	<body>
		<div class="inline-container textpad">
            <h1 class="basketville-text font-bold" >Home</h1>
            <h1 class="basketville-text font-bold" >Engineering</h1>
            <h1 class="basketville-text font-bold" >Media</h1>
            <h1 class="basketville-text font-bold" >About Me</h1>
        </div>
        <h1 class="basketville-text text-8xl textpad">Lia</h1>
	</body>
</html>
