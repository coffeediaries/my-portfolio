<!DOCTYPE html>
<html>
	<head>
        
		<title>Lia's Portfolio</title>
		<script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
        <style>
            .basketville-text {
                font-family: 'Libre Baskerville', serif;
            }
            .inline-container {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                flex-wrap: wrap;
                gap: 2vw;
            }
            .textpad {
                padding: clamp(8px, 1.5vw, 24px) clamp(12px, 2.5vw, 32px);
                box-sizing: border-box;
            }
            body {
                background-color: #112250;
                color: #f4f1ea;
                padding-left: 20px;
                padding-right: 20px;
                overflow-x: hidden;
            }
            @font-face {
                font-family: 'Blosta Script';
                src: url(Blosta-Script.otf) format('opentype');
                font-weight: normal;
                font-style: normal;
                font-display: swap;
            }
            .blosta-text{
                font-family: 'Blosta Script', cursive;
            }
            .container {
                display: flex;
                align-items: center;
                gap: 20px;
            }
            .nav {
                font-size: clamp(0.875rem, 2.5vw, 1.75rem);
                white-space: nowrap;
            }
            .hero {
                position: relative;
                padding: clamp(60px, 12vw, 160px) 0;
            }
            .hero-text {
                position: absolute;
                z-index: 10;
                margin: 0;
                pointer-events: none;
                white-space: nowrap;
                line-height: 1;
                font-size: clamp(5rem, 22vw, 20rem);
                text-shadow: 0 0 12px #fff, 0 0 32px rgba(255,255,255,0,6);
            }
            .hero-text.top {top:0; left:0;}
            .hero-text.bottom {bottom:0; right:0;}
            .book {
                position: relative;
                width: clamp(160px, 38vw, 400px);
                aspect-ratio: 3/4;
                margin: 0 auto;
                perspective: 1500px;
                cursor: pointer;
                transition: transform 0.8s cubic-bezier(0.23, 1, 0.5, 1);
            }
            .book:hover, .book.open {transform:translateX(50%);}
            .sheet {
                position: absolute;
                inset: 0;
                transform-style: preserve-3d;
                transform-origin: left center;
                transition: transform 0.8s cubic-bezier(0.23, 1, 0.5, 1);
            }
            .front, .back{
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                border-radius: 4px 12px 12px 4px;
                box-shadow: 0 10px 25px rgba(0,0,0, 0.2);
                backface-visibility: hidden;
            }
            .back {
                transform: rotateY(180deg);
                border-radius: 12px 4px 4px 12px;
            }
            .book:hover .sheet,
            .book.open .sheet {
                transform: rotateY(-180deg);
            }
            .base{
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                transform: scaleX(-1);
            }
        </style>
	</head>
	<body>
		<div class="inline-container textpad">
            <a href="index.html" class="basketville-text nav font-bold">Home</a>
            <a href="engineering.html" class="basketville-text nav font-bold">Engineering</a>
            <a href="media.html" class="basketville-text nav font-bold">Media</a>
            <a href="aboutme.html" class="basketville-text nav font-bold">About Me</a>
        </div>
        <div class="hero">
            <h1 class="blosta-text hero-text top" style="line-height: 1.6;">Lia's</h1>
                <div class="book" onclick="this.classList.toggle('open')">
                    <img src="2.png" alt="Back cover" class="base">
                    <div class="sheet">
                        <img src="2.png" alt="Front cover" class="front">
                        <img src="2.png" alt="Back cover" class="back">
                    </div>
                </div>
            <h1 class="blosta-text hero-text bottom">Portfolio</h1>
        </div>
	</body>
</html>
