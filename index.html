<!DOCTYPE html>
<html>
	<head>
		<title>Lia's Portfolio</title>
		<script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
        <style>
            .basketville-text {
                font-family: 'Libre Baskerville', serif;
            }
            .inline-container {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                flex-wrap: wrap;
                gap: 2vw;
            }
            .textpad {
                padding: clamp(8px, 1.5vw, 24px) clamp(12px, 2.5vw, 32px);
                box-sizing: border-box;
            }
            body {
                background-color: #112250;
                color: #f4f1ea;
                padding-left: 20px;
                padding-right: 20px;
                overflow-x: hidden;
                padding-bottom: 1000px;
            }
            @font-face {
                font-family: 'Blosta Script';
                src: url(Blosta-Script.otf) format('opentype');
                font-weight: normal;
                font-style: normal;
                font-display: swap;
            }
            .blosta-text{
                font-family: 'Blosta Script', cursive;
            }
            .container {
                display: flex;
                align-items: center;
                gap: 20px;
            }
            .nav {
                font-size: clamp(0.875rem, 2.5vw, 1.75rem);
                white-space: nowrap;
            }
            .hero {
                position: relative;
                padding: clamp(60px, 12vw, 160px) 0;
            }
            .hero-text {
                position: absolute;
                z-index: 10;
                margin: 0;
                pointer-events: none;
                white-space: nowrap;
                line-height: 1;
                font-size: clamp(5rem, 22vw, 20rem);
                text-shadow: 0 0 12px #fff, 0 0 32px rgba(255,255,255,0.6);
            }
            .hero-text.top {top:0; left:0;}
            .hero-text.bottom {bottom:0; right:0;}
            @property --p {
                syntax: '<number>';
                inherits: true;
                initial-value: 0;
            }
            .book {
                position: sticky;
                width: clamp(160px, 38vw, 400px);
                aspect-ratio: 3/4;
                margin: 0 auto;
                perspective: 1500px;
                cursor: pointer;
                transition: transform 0.9s cubic-bezier(0.23, 1, 0.5, 1), --p 0.9s cubic-bezier(0.23, 1, 0.5, 1);
            }
            .book.open {
                --p: 1;
                transform:translateX(50%);
            }
            .sheet {
                position: absolute;
                inset: 0;
                z-index: 5;
                transform-style: preserve-3d;
                transform-origin: 1% center;
                transition: transform 0.8s cubic-bezier(0.23, 1, 0.5, 1);
            }
            .front, .back{
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                border-radius: 4px 12px 12px 4px;
                box-shadow: 0 10px 25px rgba(0,0,0, 0.2);
                backface-visibility: hidden;
            }
            .back {
                transform: rotateY(180deg);
                border-radius: 12px 4px 4px 12px;
            }
            .book.open .sheet {
                transform: rotateY(-180deg);
            }
            .base{
                position: absolute;
                inset: 0;
                z-index: 1;
                width: 100%;
                height: 100%;
                object-fit: cover;
                transform: scaleX(-1);
            }
            .hero-wrap { height: 200vh; }
            .hero { position: sticky; top: 0; }
            .item {
                position: absolute;
                z-index: 3;
                left: calc(var(--x) + var(--mx, 0%) * var(--p));
                top:  calc(var(--y) + var(--my, 0%) * var(--p));
                width: var(--w);
                opacity: min(1, calc(var(--p) * 3));
                transform:
                    translate(calc(var(--dx) * (1-var(--p))), calc(var(--dy)*(1-var(--p))))
                    rotate(calc(var(--r) * var(--p)))
                    scale(calc(0.55 + 0.45 * var(--p)));
                will-change: transform;
            }
            .item .jig{
                display: block;
                width: 100%;
                transform-origin: center;
            }
            .item img{
                display: block;
                width: 100%;
                height: auto;
                filter: drop-shadow(0 8px 10px rgba(0,0,0,0.3));
            }
            .book.open .item:hover .jig {
                animation: jiggle .45s ease-in-out;
            }
            @keyframes jiggle {
                0%, 100% {
                    transform: rotate(0deg) scale(1);
                }
                20% {
                    transform: rotate(-6deg) scale(1.05);
                }
                40% {
                    transform: rotate(5deg) scale(1.05);
                }
                60% {
                    transform: rotate(-3deg) scale(1.03);
                }
                80% {
                    transform: rotate(2deg) scale(1.02);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .book.open .item:hover .jig {
                    animation: none;
                }
            }
            .pipette { --x:8%;  --y:5%;  --w:40%; --r:35deg;  --dx:25vw;  --dy:12vw; --mx:-86.2%; z-index:6;} /*works*/
            .music   { --x:34%; --y:6.5%;  --w:40%; --r:-12deg; --dx:8vw;   --dy:14vw; --mx:-52.9%; z-index:6;} /*works*/
            .math    { --x:55%; --y:7.5%;  --w:30%; --r:5deg;   --dx:-20vw; --dy:12vw; } /*works*/
            .laptop { --x:3%;  --y:70%; --w:50%; --r:-14deg; --dx:20vw;  --dy:4vw;  --mx:-80%; --my:-10%; z-index:6; }
            .card   { --x:8%;  --y:34%; --w:100%; --r:0deg;   --dx:10vw;  --dy:10vw; --mx:-50%; --my:0%;   z-index:6; }
            .camera { --x:44%; --y:72%; --w:48%; --r:-50deg;  --dx:-15vw; --dy:-4vw; --mx:0%;   --my:0%;   z-index:6; }
            
        </style>
	</head>
	<body>
		<div class="inline-container textpad">
            <a href="index.html" class="basketville-text nav font-bold">Home</a>
            <a href="engineering.html" class="basketville-text nav font-bold">Engineering</a>
            <a href="media.html" class="basketville-text nav font-bold">Media</a>
            <a href="aboutme.html" class="basketville-text nav font-bold">About Me</a>
        </div>
        <div class ="hero-wrap">
            <div class="hero">
                <h1 class="blosta-text hero-text top" style="line-height: 1.6;">Lia's</h1>
                    <div class="book" id="book" onclick="this.classList.toggle('open')">
                        <img src="2.png" alt="Back cover" class="base">
                        <div class="sheet">
                            <img src="2.png" alt="Front cover" class="front">
                            <img src="2.png" alt="Back cover" class="back">
                        </div>
                        <div class="item pipette"><div class="jig"><img src="pen.png" alt="Pipette"></div></div>
                        <div class="item music"><div class="jig"><img src="music.png" alt="MP3"></div></div>
                        <div class="item math"><div class="jig"><img src="math.jpg" alt="Math Book"></div></div>
                        <div class="item laptop"><div class="jig"><img src="laptop.png" alt="Laptop"></div></div>
                        <div class="item camera"><div class="jig"><img src="camera.png" alt="Camera"></div></div>
                        <div class="item card"><div class="jig"><img src="card.png" alt="About me"></div></div>
                    </div>
                <h1 class="blosta-text hero-text bottom">Portfolio</h1>
            </div>
        </div>
        <script>
            const book = document.getElementById('book');
            let lastY = window.scrollY;

            window.addEventListener('scroll', () => {
                const y = Math.max(0, window.scrollY);
                if (y> lastY + 5) {
                    book.classList.add('open');
                } else if (y < lastY - 5) {
                    book.classList.remove('open');
                }
                lastY = y;
            }, {passive: true});
        </script>
	</body>
</html>
